[project]
name = "telegram-matrix-stickers"
version = "0.2.0"
description = "Manage a Matrix sticker library from a private Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=11,<13",
    "python-dotenv>=1,<2",
    "python-telegram-bot>=22,<23",
    "rlottie-python>=1.3.8,<2",
]

[project.scripts]
matrix-stickers = "matrix_stickers.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_stickers"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
