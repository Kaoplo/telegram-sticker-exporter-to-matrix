name: Test and publish container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main builds so an older run cannot overwrite a newer latest tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install video renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check dependencies
        run: uv pip check
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

  container:
    name: Build, verify, and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:latest" .
      - name: Smoke-test image as container user
        run: |
          docker run --rm \
            -e TELEGRAM_BOT_TOKEN=test-token \
            -e TELEGRAM_USER_ID=1 \
            -e MATRIX_HOMESERVER=https://matrix.example.org \
            -e MATRIX_USER_ID=@test:example.org \
            -e MATRIX_ACCESS_TOKEN=test-token \
            -e MATRIX_PACK_ROOM_ID=!testroom \
            --entrypoint python "$IMAGE:sha-$GITHUB_SHA" \
            -c 'import os; from matrix_stickers.config import Settings; from matrix_stickers.app import build_application; assert os.getuid() != 0; assert build_application(Settings.from_env()).handlers'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Official Docker login action, pinned as in GitHub's GHCR guide.
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
